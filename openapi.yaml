openapi: 3.0.3
info:
  title: Mock ERP API (ERPNext Aligned)
  version: v15.0.0
  description: >
    Mock ERP server simulating ERPNext (Frappe Framework) REST API conventions.
    All resource endpoints are available under `/api/resource/{DocType}`.
servers:
  - url: http://localhost:8081/api
    description: Mock ERP Server

components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Format: token {api_key}:{api_secret}"

  schemas:
    Error:
      type: object
      properties:
        exc_type:
          type: string
          example: "DoesNotExistError"
        exception:
          type: string
          example: "frappe.exceptions.DoesNotExistError: Resource not found"
        _server_messages:
          type: string
          example: "[]"

    # Finance Schemas
    PurchaseInvoiceItem:
      type: object
      properties:
        item_code: { type: string }
        item_name: { type: string }
        qty: { type: number }
        uom: { type: string }
        rate: { type: number }
        amount: { type: number }
        expense_account: { type: string }

    PurchaseInvoice:
      type: object
      properties:
        name: { type: string }
        doctype: { type: string, example: "Purchase Invoice" }
        docstatus: { type: integer, enum: [0, 1, 2] }
        supplier: { type: string }
        supplier_name: { type: string }
        posting_date: { type: string, format: date }
        grand_total: { type: number }
        status: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseInvoiceItem'

    PaymentEntry:
      type: object
      properties:
        name: { type: string }
        doctype: { type: string, example: "Payment Entry" }
        docstatus: { type: integer }
        payment_type: { type: string }
        mode_of_payment: { type: string }
        party_type: { type: string }
        party: { type: string }
        party_name: { type: string }
        posting_date: { type: string, format: date }
        paid_amount: { type: number }
        received_amount: { type: number }
        status: { type: string }

    JournalEntry:
      type: object
      properties:
        name: { type: string }
        doctype: { type: string, example: "Journal Entry" }
        docstatus: { type: integer }
        voucher_type: { type: string }
        posting_date: { type: string, format: date }
        total_debit: { type: number }
        total_credit: { type: number }
        remark: { type: string }

    # HR Schemas
    Employee:
      type: object
      properties:
        name: { type: string }
        employee_name: { type: string }
        designation: { type: string }
        department: { type: string }
        status: { type: string, enum: [Active, Inactive, Left] }
        user_id: { type: string, format: email }

    Department:
      type: object
      properties:
        name: { type: string }
        department_name: { type: string }
        company: { type: string }

    LeaveApplication:
      type: object
      properties:
        name: { type: string }
        employee: { type: string }
        leave_type: { type: string }
        from_date: { type: string, format: date }
        to_date: { type: string, format: date }
        total_leave_days: { type: number }
        status: { type: string }

    SalarySlip:
      type: object
      properties:
        name: { type: string }
        employee: { type: string }
        posting_date: { type: string, format: date }
        gross_pay: { type: number }
        net_pay: { type: number }
        status: { type: string }

    # Inventory Schemas
    Item:
      type: object
      properties:
        name: { type: string }
        item_code: { type: string }
        item_name: { type: string }
        item_group: { type: string }
        stock_uom: { type: string }
        standard_rate: { type: number }
        valuation_rate: { type: number }

    Bin:
      type: object
      properties:
        name: { type: string }
        item_code: { type: string }
        warehouse: { type: string }
        actual_qty: { type: number }
        reserved_qty: { type: number }
        ordered_qty: { type: number }
        projected_qty: { type: number }

    PurchaseOrder:
      type: object
      properties:
        name: { type: string }
        supplier: { type: string }
        transaction_date: { type: string, format: date }
        grand_total: { type: number }
        status: { type: string }

    PluginFixture:
      type: object
      required: [id, state]
      properties:
        id: { type: string, example: plugin-fixture }
        state: { type: string, example: source }

    IntegrationEchoRequest:
      type: object
      additionalProperties: true
      example:
        nested: { value: 7 }
        items: [a, b]

    IntegrationEchoResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/IntegrationEchoRequest'

    IntegrationEchoLastResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/IntegrationEchoRequest'
          nullable: true

paths:
  /resource/Purchase Invoice:
    get:
      summary: Fetch a paginated list of all purchase invoices stored in the finance module.
      description: Retrieve a list of all purchase invoices from the finance module.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PurchaseInvoice'
    post:
      summary: Create a new purchase invoice draft in the finance module (requires finance_editor role).
      description: Create a new purchase invoice draft in the finance module. Requires finance_editor role.
      security: [{ TokenAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseInvoice'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PurchaseInvoice'

  /resource/Purchase Invoice/{name}:
    get:
      summary: Retrieve the full details of a single purchase invoice by its unique name (e.g., ACC-PINV-2026-00001).
      description: Retrieve the full details of a single purchase invoice by its unique name.
      security: [{ TokenAuth: [] }]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PurchaseInvoice'

  /resource/Payment Entry:
    get:
      summary: Get a list of all payment entries, including their status, payment mode, and linked invoices.
      description: Retrieve a list of payment entries from the finance module.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentEntry'

  /resource/Journal Entry:
    get:
      summary: Retrieve all journal entries for accounting audits and ledger verification.
      description: Retrieve all journal entries from the finance module.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/JournalEntry'

  /resource/Employee:
    get:
      summary: List all active and inactive employees with basic profile information such as designation and department.
      description: Retrieve a list of employees from the HR module.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Employee'

  /resource/Employee/{name}:
    get:
      summary: Retrieve detailed profile information for a specific employee by name (e.g., EMP-00001).
      description: Retrieve detailed information for a specific employee by name.
      security: [{ TokenAuth: [] }]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Employee'

  /resource/Department:
    get:
      summary: List all company departments and their organizational hierarchy.
      description: Retrieve a list of departments from the HR module.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Department'

  /resource/Leave Application:
    get:
      summary: Fetch a list of employee leave applications, including dates, types, and current approval status.
      description: Retrieve a list of leave applications from the HR module.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeaveApplication'

  /resource/Salary Slip:
    get:
      summary: Retrieve salary slips for all employees for payroll review and verification.
      description: Retrieve a list of salary slips from the HR module.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SalarySlip'

  /resource/Item:
    get:
      summary: Get a comprehensive list of all stock and non-stock items available in the inventory.
      description: Retrieve a list of items from the inventory module.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'

  /resource/Item/{name}:
    get:
      summary: Retrieve detailed technical and commercial information for a specific item by its item code or name.
      description: Retrieve detailed information for a specific item by name.
      security: [{ TokenAuth: [] }]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Item'

  /resource/Bin:
    get:
      summary: Query current stock levels (actual, reserved, ordered) across all warehouses (optionally filter by item_code).
      description: Retrieve stock levels (bins) for items, optionally filtered by item_code.
      security: [{ TokenAuth: [] }]
      parameters:
        - name: filters
          in: query
          schema:
            type: string
          example: '[["Bin","item_code","=","ITEM-001"]]'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bin'

  /resource/Purchase Order:
    get:
      summary: List all purchase orders and their current status (e.g., To Receive and Bill).
      description: Retrieve a list of purchase orders from the inventory module.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PurchaseOrder'

  /resource/Plugin Fixture:
    get:
      summary: Return the stable fixture used by downstream integration tests.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: Stable non-PII fixture.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PluginFixture'
              example:
                data: { id: plugin-fixture, state: source }
        '401':
          description: ERPNext-style authentication error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /integration/echo:
    post:
      summary: Echo and record one JSON object for integration-test inspection.
      security: [{ TokenAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationEchoRequest'
      responses:
        '200':
          description: The exact received object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationEchoResponse'
        '401':
          description: ERPNext-style authentication error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The request body is not a JSON object.

  /integration/echo/last:
    get:
      summary: Return the last object received by the echo fixture.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: The last object, or null before the first successful echo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationEchoLastResponse'
        '401':
          description: ERPNext-style authentication error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
