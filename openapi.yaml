openapi: 3.0.3
info:
  title: Mock ERP API (ERPNext Aligned)
  version: v15.0.0
  description: >
    Mock ERP server simulating ERPNext (Frappe Framework) REST API conventions.
    All resource endpoints are available under `/api/resource/{DocType}`.
servers:
  - url: http://localhost:8081/api
    description: Mock ERP Server

components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Format: token {api_key}:{api_secret}"

  schemas:
    Error:
      type: object
      properties:
        exc_type:
          type: string
          example: "DoesNotExistError"
        exception:
          type: string
          example: "frappe.exceptions.DoesNotExistError: Resource not found"
        _server_messages:
          type: string
          example: "[]"

    # Finance Schemas
    PurchaseInvoiceItem:
      type: object
      properties:
        item_code: { type: string }
        item_name: { type: string }
        qty: { type: number }
        uom: { type: string }
        rate: { type: number }
        amount: { type: number }
        expense_account: { type: string }

    PurchaseInvoice:
      type: object
      properties:
        name: { type: string }
        doctype: { type: string, example: "Purchase Invoice" }
        docstatus: { type: integer, enum: [0, 1, 2] }
        supplier: { type: string }
        supplier_name: { type: string }
        posting_date: { type: string, format: date }
        grand_total: { type: number }
        status: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseInvoiceItem'

    PaymentEntry:
      type: object
      properties:
        name: { type: string }
        doctype: { type: string, example: "Payment Entry" }
        docstatus: { type: integer }
        payment_type: { type: string }
        mode_of_payment: { type: string }
        party_type: { type: string }
        party: { type: string }
        party_name: { type: string }
        posting_date: { type: string, format: date }
        paid_amount: { type: number }
        received_amount: { type: number }
        status: { type: string, enum: [Draft, Submitted, Cancelled] }
        paid_from: { type: string }
        paid_to: { type: string }
        references:
          type: array
          items:
            type: object
            properties:
              reference_doctype: { type: string }
              reference_name: { type: string }
              allocated_amount: { type: number }

    JournalEntry:
      type: object
      properties:
        name: { type: string }
        doctype: { type: string, example: "Journal Entry" }
        docstatus: { type: integer }
        voucher_type: { type: string }
        posting_date: { type: string, format: date }
        total_debit: { type: number }
        total_credit: { type: number }
        remark: { type: string }
        status: { type: string, enum: [Draft, Submitted, Cancelled] }
        accounts:
          type: array
          items:
            type: object
            required: [account]
            properties:
              account: { type: string }
              debit: { type: number, minimum: 0 }
              credit: { type: number, minimum: 0 }

    # HR Schemas
    Employee:
      type: object
      properties:
        name: { type: string }
        employee_name: { type: string }
        designation: { type: string }
        department: { type: string }
        status: { type: string, enum: [Active, Inactive, Left] }
        user_id: { type: string, format: email }

    Department:
      type: object
      properties:
        name: { type: string }
        department_name: { type: string }
        company: { type: string }

    LeaveApplication:
      type: object
      properties:
        name: { type: string }
        employee: { type: string }
        leave_type: { type: string }
        from_date: { type: string, format: date }
        to_date: { type: string, format: date }
        total_leave_days: { type: number }
        status: { type: string }

    SalarySlip:
      type: object
      properties:
        name: { type: string }
        employee: { type: string }
        posting_date: { type: string, format: date }
        gross_pay: { type: number }
        net_pay: { type: number }
        status: { type: string }

    # Inventory Schemas
    Item:
      type: object
      properties:
        name: { type: string }
        item_code: { type: string }
        item_name: { type: string }
        item_group: { type: string }
        stock_uom: { type: string }
        standard_rate: { type: number }
        valuation_rate: { type: number }

    Bin:
      type: object
      properties:
        name: { type: string }
        item_code: { type: string }
        warehouse: { type: string }
        actual_qty: { type: number }
        reserved_qty: { type: number }
        ordered_qty: { type: number }
        projected_qty: { type: number }

    PurchaseOrder:
      type: object
      properties:
        name: { type: string }
        supplier: { type: string }
        transaction_date: { type: string, format: date }
        grand_total: { type: number }
        status: { type: string }

    PluginFixture:
      type: object
      required: [id, state]
      properties:
        id: { type: string, example: plugin-fixture }
        state: { type: string, example: source }

    IntegrationEchoRequest:
      type: object
      additionalProperties: true
      example:
        nested: { value: 7 }
        items: [a, b]

    IntegrationEchoResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/IntegrationEchoRequest'

    IntegrationEchoLastResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/IntegrationEchoRequest'
          nullable: true

    OrganizationResource:
      type: object
      properties:
        name: { type: string }
        is_active: { type: integer, enum: [0, 1] }

    ApprovalRequest:
      type: object
      required: [document_type, reference_name, amount]
      properties:
        name: { type: string }
        document_type: { type: string }
        reference_name: { type: string }
        amount: { type: number, minimum: 0 }
        status:
          type: string
          enum: [PENDING_APPROVAL, APPROVED, REJECTED, CANCELLED]
        requester_identity: { type: string }

    ApprovalActionRequest:
      type: object
      properties:
        comment: { type: string }

    AuditEvent:
      type: object
      properties:
        name: { type: string }
        actor_identity: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        before: { type: object, nullable: true }
        after: { type: object, nullable: true }
        created_at: { type: string, format: date-time }

paths:
  /resource/Purchase Invoice:
    get:
      summary: Fetch a paginated list of all purchase invoices stored in the finance module.
      description: Retrieve a list of all purchase invoices from the finance module.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PurchaseInvoice'
    post:
      summary: Create a new purchase invoice draft in the finance module (requires finance_editor role).
      description: Create a new purchase invoice draft in the finance module. Requires finance_editor role.
      security: [{ TokenAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseInvoice'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PurchaseInvoice'

  /resource/Purchase Invoice/{name}:
    get:
      summary: Retrieve the full details of a single purchase invoice by its unique name (e.g., ACC-PINV-2026-00001).
      description: Retrieve the full details of a single purchase invoice by its unique name.
      security: [{ TokenAuth: [] }]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PurchaseInvoice'

  /resource/Sales Order:
    get:
      summary: List Southern Hotels and other fictional customer sales orders.
      security: [{ TokenAuth: [] }]
      responses:
        '200': { description: Sales order records. }
    post:
      summary: Create a sales order with customer credit-limit validation.
      security: [{ TokenAuth: [] }]
      responses:
        '201': { description: Sales order created. }
        '422': { description: Credit limit or item validation failure. }

  /resource/Delivery Note:
    get:
      summary: List delivery notes.
      security: [{ TokenAuth: [] }]
      responses:
        '200': { description: Delivery note records. }
    post:
      summary: Create a delivery note from a sales order.
      security: [{ TokenAuth: [] }]
      responses:
        '201': { description: Delivery note created. }

  /resource/Delivery Note/{name}/submit:
    post:
      summary: Submit a delivery note and issue stock.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Delivery note submitted. }
        '422': { description: Over-delivery or insufficient stock. }

  /resource/Sales Invoice:
    get:
      summary: List sales invoices and AR balances.
      security: [{ TokenAuth: [] }]
      responses:
        '200': { description: Sales invoice records. }
    post:
      summary: Create a sales invoice from a submitted delivery note.
      security: [{ TokenAuth: [] }]
      responses:
        '201': { description: Sales invoice created. }

  /resource/Sales Invoice/{name}/submit:
    post:
      summary: Submit a sales invoice and create an AR open item.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Sales invoice submitted. }
        '422': { description: Invalid billing lifecycle. }

  /resource/Material Request:
    get:
      summary: List material requests.
      security: [{ TokenAuth: [] }]
      responses:
        '200': { description: Material request records. }
    post:
      summary: Create a material request.
      security: [{ TokenAuth: [] }]
      responses:
        '201': { description: Material request created. }

  /resource/Purchase Receipt:
    get:
      summary: List purchase receipts.
      security: [{ TokenAuth: [] }]
      responses:
        '200': { description: Purchase receipt records. }
    post:
      summary: Create a receipt from an approved purchase order.
      security: [{ TokenAuth: [] }]
      responses:
        '201': { description: Purchase receipt created. }

  /resource/Purchase Receipt/{name}/submit:
    post:
      summary: Submit a receipt and update the stock ledger.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Purchase receipt submitted. }
        '422': { description: Over-receipt or invalid lifecycle. }

  /resource/Purchase Invoice/{name}/submit:
    post:
      summary: Submit a purchase invoice and create an AP open item.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Purchase invoice submitted. }
        '422': { description: Over-bill or invalid lifecycle. }

  /resource/Account:
    get:
      summary: List the seeded SCP chart of accounts.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: Account records.

  /resource/Payment Entry:
    get:
      summary: Get payment entries from the immutable payment ledger boundary.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: Payment entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaymentEntry' }
    post:
      summary: Create a draft payment entry.
      security: [{ TokenAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentEntry' }
      responses:
        '201': { description: Draft payment entry created. }
        '422': { description: Invalid payment or account. }

  /resource/Payment Entry/{name}:
    get:
      summary: Retrieve one payment entry.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Payment entry. }
        '404': { description: Payment entry not found. }

  /resource/Payment Entry/{name}/submit:
    post:
      summary: Submit a payment and post its balanced ledger entries.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Payment submitted. }
        '422': { description: Invalid allocation or lifecycle state. }

  /resource/Payment Entry/{name}/cancel:
    post:
      summary: Cancel a payment with a compensating ledger posting.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Payment cancelled. }
        '422': { description: Invalid lifecycle state. }

  /resource/Journal Entry:
    get:
      summary: Retrieve journal entries for accounting audits and ledger verification.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: Journal entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/JournalEntry' }
    post:
      summary: Create a draft journal entry.
      security: [{ TokenAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalEntry' }
      responses:
        '201': { description: Draft journal entry created. }
        '422': { description: Invalid or unbalanced journal entry. }

  /resource/Journal Entry/{name}:
    get:
      summary: Retrieve one journal entry.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Journal entry. }
        '404': { description: Journal entry not found. }

  /resource/Journal Entry/{name}/submit:
    post:
      summary: Submit a balanced journal entry to the GL.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Journal entry submitted. }
        '422': { description: Journal entry is not balanced or not draft. }

  /resource/Journal Entry/{name}/cancel:
    post:
      summary: Cancel a journal entry with a reversing posting.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Journal entry cancelled. }
        '422': { description: Invalid lifecycle state. }

  /resource/Attendance:
    get:
      summary: List attendance records with Frappe HR attendance states.
      security: [{ TokenAuth: [] }]
      responses:
        '200': { description: Attendance records. }
    post:
      summary: Create one attendance record.
      security: [{ TokenAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee, attendance_date, status]
              properties:
                employee: { type: string }
                attendance_date: { type: string, format: date }
                status: { type: string, enum: [Present, Absent, Half Day, Work From Home] }
      responses:
        '201': { description: Attendance created. }
        '422': { description: Invalid, future, or duplicate attendance. }

  /resource/Leave Type:
    get:
      summary: List configured leave types.
      security: [{ TokenAuth: [] }]
      responses:
        '200': { description: Leave type records. }

  /resource/Leave Allocation:
    get:
      summary: List employee leave allocations and remaining balances.
      security: [{ TokenAuth: [] }]
      responses:
        '200': { description: Leave allocation records. }

  /resource/Employee:
    get:
      summary: List all active and inactive employees with basic profile information such as designation and department.
      description: Retrieve a list of employees from the HR module.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Employee'

  /resource/Employee/{name}:
    get:
      summary: Retrieve detailed profile information for a specific employee by name (e.g., EMP-00001).
      description: Retrieve detailed information for a specific employee by name.
      security: [{ TokenAuth: [] }]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Employee'

  /resource/Leave Application:
    get:
      summary: Fetch employee leave applications and approval status.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: Leave application records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LeaveApplication' }
    post:
      summary: Create a leave application for sequential approval.
      security: [{ TokenAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveApplication' }
      responses:
        '201': { description: Leave application created. }
        '422': { description: Insufficient balance or invalid dates. }

  /resource/Leave Application/{name}:
    get:
      summary: Retrieve one leave application.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Leave application. }
        '404': { description: Leave application not found. }

  /resource/Leave Application/{name}/approve:
    post:
      summary: Approve the next leave workflow sequence.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Leave application advanced. }
        '422': { description: Wrong role or workflow state. }

  /resource/Leave Application/{name}/reject:
    post:
      summary: Reject a leave application.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Leave application rejected. }
        '422': { description: Wrong role or workflow state. }

  /resource/Leave Application/{name}/cancel:
    post:
      summary: Cancel a leave application and release approved balance.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Leave application cancelled. }
        '422': { description: Invalid lifecycle state. }

  /resource/Salary Slip:
    get:
      summary: Retrieve salary slips for payroll review and verification.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: Salary slips.
    post:
      summary: Calculate a draft salary slip from an active assignment.
      security: [{ TokenAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee, start_date, end_date]
              properties:
                employee: { type: string }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
      responses:
        '201': { description: Salary slip created. }
        '422': { description: No active assignment or invalid period. }

  /resource/Salary Slip/{name}/submit:
    post:
      summary: Submit a calculated salary slip and post its GL entry.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Salary slip submitted. }
        '422': { description: Invalid salary slip lifecycle. }

  /resource/Expense Claim:
    get:
      summary: List employee expense claims.
      security: [{ TokenAuth: [] }]
      responses:
        '200': { description: Expense claims. }
    post:
      summary: Create an expense claim for approval.
      security: [{ TokenAuth: [] }]
      responses:
        '201': { description: Expense claim created. }
        '422': { description: Invalid expense claim. }

  /resource/Expense Claim/{name}/approve:
    post:
      summary: Approve an expense claim.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Expense claim approved. }

  /resource/Expense Claim/{name}/reimburse:
    post:
      summary: Reimburse an approved expense claim through Payment Entry.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Expense claim reimbursed. }

  /resource/Customer:
    get:
      summary: List fictional SCP customers with safe contacts.
      security: [{ TokenAuth: [] }]
      responses:
        '200': { description: Customer records. }

  /resource/Supplier:
    get:
      summary: List fictional SCP suppliers with safe contacts.
      security: [{ TokenAuth: [] }]
      responses:
        '200': { description: Supplier records. }

  /resource/Item Group:
    get:
      summary: List SCP item groups.
      security: [{ TokenAuth: [] }]
      responses:
        '200': { description: Item group records. }

  /resource/UOM:
    get:
      summary: List SCP units of measure.
      security: [{ TokenAuth: [] }]
      responses:
        '200': { description: UOM records. }

  /resource/Warehouse:
    get:
      summary: List the SCP warehouse tree.
      security: [{ TokenAuth: [] }]
      responses:
        '200': { description: Warehouse records. }

  /resource/Item:
    get:
      summary: Get a comprehensive list of all stock and non-stock items available in the inventory.
      description: Retrieve a list of items from the inventory module.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'

  /resource/Item/{name}:
    get:
      summary: Retrieve detailed technical and commercial information for a specific item by its item code or name.
      description: Retrieve detailed information for a specific item by name.
      security: [{ TokenAuth: [] }]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Item'

  /resource/Stock Entry:
    get:
      summary: List stock transaction documents.
      security: [{ TokenAuth: [] }]
      responses:
        '200': { description: Stock entry records. }
    post:
      summary: Create a draft stock transaction.
      security: [{ TokenAuth: [] }]
      responses:
        '201': { description: Stock entry created. }
        '422': { description: Invalid item, warehouse, or quantity. }

  /resource/Stock Entry/{name}/submit:
    post:
      summary: Submit a stock transaction to the append-only stock ledger.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Stock entry submitted. }
        '422': { description: Negative stock or invalid lifecycle. }

  /resource/Stock Entry/{name}/cancel:
    post:
      summary: Cancel a stock transaction with reversing ledger entries.
      security: [{ TokenAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Stock entry cancelled. }

  /resource/Bin:
    get:
      summary: Query current stock levels (actual, reserved, ordered) across all warehouses (optionally filter by item_code).
      description: Retrieve stock levels (bins) for items, optionally filtered by item_code.
      security: [{ TokenAuth: [] }]
      parameters:
        - name: filters
          in: query
          schema:
            type: string
          example: '[["Bin","item_code","=","ITEM-001"]]'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bin'

  /resource/Purchase Order:
    get:
      summary: List purchase orders and approval status.
      security: [{ TokenAuth: [] }]
      responses:
        '200':
          description: Purchase order records.
    post:
      summary: Create a purchase order from an approved material request.
      security: [{ TokenAuth: [] }]
      responses:
        '201': { description: Purchase order created. }
        '422': { description: Missing source or invalid threshold. }

