[project]
name = "mock-erp"
version = "0.1.1"
description = "ERPNext-aligned SQLite Mock ERP for ERPBridge integration tests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "python-multipart>=0.0.31",
    "uvicorn>=0.46.0",
]

[dependency-groups]
test = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pyyaml>=6.0.2",
]
dev = [
    "ruff>=0.11.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
